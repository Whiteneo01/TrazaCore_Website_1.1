  <text x="44" y="34" font-size="13.5" font-weight="800" letter-spacing="1.4" fill="#62dfd0">END-TO-END OPERATIONAL TRACEABILITY  ·  DOCK TO DELIVERY</text>
  <text x="44" y="74" font-size="27" font-weight="700" fill="#ffffff">How Every Product Moves Safely from Receiving to Dispatch</text>
  <rect x="44" y="152" width="258" height="430" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><path d="M56,152 h234 a12,12 0 0 1 12,12 v92 h-258 v-92 a12,12 0 0 1 12,-12 z" fill="#10384a"/><text x="68" y="186" font-size="13" font-weight="800" letter-spacing="1.2" fill="#62dfd0">STEP 1</text><text x="68" y="222" font-size="20" font-weight="700" fill="#ffffff">Receive &amp; Lock</text><text x="66" y="310" font-size="14.5" fill="#2d414e">Verify inbound items</text><text x="66" y="335" font-size="14.5" fill="#2d414e">against orders, print</text><text x="66" y="360" font-size="14.5" fill="#2d414e">clean labels, and keep</text><text x="66" y="385" font-size="14.5" fill="#2d414e">stock locked until quality</text><text x="66" y="410" font-size="14.5" fill="#2d414e">certificates are approved.</text><rect x="66" y="520" width="214" height="40" rx="20" fill="#e8f9f6" stroke="#aee7dd" stroke-width="1"/><circle cx="82" cy="540" r="4.5" fill="#10b7a5"/><text x="94" y="545" font-size="13" font-weight="700" fill="#0a766d">Zero Uncertified Goods</text><line x1="307" y1="367" x2="322" y2="367" stroke="#10b7a5" stroke-width="3.5"/><polygon points="321,361 330,367 321,373" fill="#10b7a5"/><rect x="328" y="152" width="258" height="430" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><path d="M340,152 h234 a12,12 0 0 1 12,12 v92 h-258 v-92 a12,12 0 0 1 12,-12 z" fill="#0b2b3d"/><text x="352" y="186" font-size="13" font-weight="800" letter-spacing="1.2" fill="#62dfd0">STEP 2</text><text x="352" y="222" font-size="20" font-weight="700" fill="#ffffff">Organize Smartly</text><text x="350" y="310" font-size="14.5" fill="#2d414e">Place fast-moving products</text><text x="350" y="335" font-size="14.5" fill="#2d414e">closest to dispatch lanes</text><text x="350" y="360" font-size="14.5" fill="#2d414e">and assign clear addresses</text><text x="350" y="385" font-size="14.5" fill="#2d414e">across every shelf and</text><text x="350" y="410" font-size="14.5" fill="#2d414e">branch.</text><rect x="350" y="520" width="214" height="40" rx="20" fill="#e8f9f6" stroke="#aee7dd" stroke-width="1"/><circle cx="366" cy="540" r="4.5" fill="#10b7a5"/><text x="378" y="545" font-size="13" font-weight="700" fill="#0a766d">Faster Floor Flow</text><line x1="591" y1="367" x2="606" y2="367" stroke="#10b7a5" stroke-width="3.5"/><polygon points="605,361 614,367 605,373" fill="#10b7a5"/><rect x="612" y="152" width="258" height="430" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><path d="M624,152 h234 a12,12 0 0 1 12,12 v92 h-258 v-92 a12,12 0 0 1 12,-12 z" fill="#10384a"/><text x="636" y="186" font-size="13" font-weight="800" letter-spacing="1.2" fill="#62dfd0">STEP 3</text><text x="636" y="222" font-size="20" font-weight="700" fill="#ffffff">Pick with Speed</text><text x="634" y="310" font-size="14.5" fill="#2d414e">Warehouse staff follow</text><text x="634" y="335" font-size="14.5" fill="#2d414e">guided routes on mobile</text><text x="634" y="360" font-size="14.5" fill="#2d414e">scanners—even offline in</text><text x="634" y="385" font-size="14.5" fill="#2d414e">remote sites—cutting</text><text x="634" y="410" font-size="14.5" fill="#2d414e">picking errors.</text><rect x="634" y="520" width="214" height="40" rx="20" fill="#e8f9f6" stroke="#aee7dd" stroke-width="1"/><circle cx="650" cy="540" r="4.5" fill="#10b7a5"/><text x="662" y="545" font-size="13" font-weight="700" fill="#0a766d">Real-Time Accuracy</text><line x1="875" y1="367" x2="890" y2="367" stroke="#10b7a5" stroke-width="3.5"/><polygon points="889,361 898,367 889,373" fill="#10b7a5"/><rect x="896" y="152" width="258" height="430" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><path d="M908,152 h234 a12,12 0 0 1 12,12 v92 h-258 v-92 a12,12 0 0 1 12,-12 z" fill="#07766d"/><text x="920" y="186" font-size="13" font-weight="800" letter-spacing="1.2" fill="#62dfd0">STEP 4</text><text x="920" y="222" font-size="20" font-weight="700" fill="#ffffff">Ship &amp; Bill Cleanly</text><text x="918" y="310" font-size="14.5" fill="#2d414e">Validate customer order</text><text x="918" y="335" font-size="14.5" fill="#2d414e">accuracy, issue SUNAT</text><text x="918" y="360" font-size="14.5" fill="#2d414e">electronic dispatch guides</text><text x="918" y="385" font-size="14.5" fill="#2d414e">automatically, and update</text><text x="918" y="410" font-size="14.5" fill="#2d414e">accounting live.</text><rect x="918" y="520" width="214" height="40" rx="20" fill="#e8f9f6" stroke="#aee7dd" stroke-width="1"/><circle cx="934" cy="540" r="4.5" fill="#10b7a5"/><text x="946" y="545" font-size="13" font-weight="700" fill="#0a766d">Full Audit Trail</text>
  <text x="44" y="646" font-size="13" fill="#5b6e78">TrazaCore Ingeniería &amp; Sistemas S.A.C. · Designed for executive visibility and floor-level reliability.</text>
