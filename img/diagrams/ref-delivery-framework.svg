 y="335" font-size="14.5" fill="#2d414e">without halting daily</text><text x="918" y="360" font-size="14.5" fill="#2d414e">customer dispatches,</text><text x="918" y="385" font-size="14.5" fill="#2d414e">backed by 24/7 local</text><text x="918" y="410" font-size="14.5" fill="#2d414e">support and optimization.</text><rect x="918" y="520" width="214" height="40" rx="20" fill="#e8f9f6" stroke="#aee7dd" stroke-width="1"/><circle cx="934" cy="540" r="4.5" fill="#10b7a5"/><text x="948" y="545" font-size="13" font-weight="700" fill="#0a766d">Zero Disruption</text>
