" stroke-width="1"/><text x="458" y="273" font-size="15.5" font-weight="700" fill="#071e2b">Guided Mobile Picking</text><text x="458" y="299" font-size="13.5" fill="#475569">Operators scan fast with rugged</text><text x="458" y="319" font-size="13.5" fill="#475569">handheld devices.</text><rect x="444" y="355" width="312" height="98" rx="8" fill="#f2f9f8" stroke="#c4e9e3" stroke-width="1"/><text x="458" y="385" font-size="15.5" font-weight="700" fill="#071e2b">Built-In Quality Locks</text><text x="458" y="411" font-size="13.5" fill="#475569">Uncertified lots cannot be shipped by</text><text x="458" y="431" font-size="13.5" fill="#475569">mistake.</text><rect x="444" y="467" width="312" height="98" rx="8" fill="#f2f9f8" stroke="#c4e9e3" stroke-width="1"/><text x="458" y="497" font-size="15.5" font-weight="700" fill="#071e2b">Fewer Picking Errors</text><text x="458" y="523" font-size="13.5" fill="#475569">Organized shelves cut wasted floor</text><text x="458" y="543" font-size="13.5" fill="#475569">search time.</text><rect x="804" y="145" width="352" height="445" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><path d="M816,145 h328 a12,12 0 0 1 12,12 v64 h-352 v-64 a12,12 0 0 1 12,-12 z" fill="#07766d"/><text x="826" y="171" font-size="13" font-weight="800" letter-spacing="1.2" fill="#62dfd0">PILLAR 03</text><text x="826" y="200" font-size="19" font-weight="700" fill="#ffffff">Cloud Peace of Mind</text><rect x="824" y="243" width="312" height="98" rx="8" fill="#f2f9f8" stroke="#c4e9e3" stroke-width="1"/><text x="838" y="273" font-size="15.5" font-weight="700" fill="#071e2b">Client-Owned Cloud</text><text x="838" y="299" font-size="13.5" fill="#475569">Always-on availability without local</text><text x="838" y="319" font-size="13.5" fill="#475569">server headaches.</text><rect x="824" y="355" width="312" height="98" rx="8" fill="#f2f9f8" stroke="#c4e9e3" stroke-width="1"/><text x="838" y="385" font-size="15.5" font-weight="700" fill="#071e2b">Enterprise Protection</text><text x="838" y="411" font-size="13.5" fill="#475569">Strong access governance and</text><text x="838" y="431" font-size="13.5" fill="#475569">continuous monitoring.</text><rect x="824" y="467" width="312" height="98" rx="8" fill="#f2f9f8" stroke="#c4e9e3" stroke-width="1"/><text x="838" y="497" font-size="15.5" font-weight="700" fill="#071e2b">Zero Vendor Lock-In</text><text x="838" y="523" font-size="13.5" fill="#475569">Full ownership of your data, code, and</text><text x="838" y="543" font-size="13.5" fill="#475569">exit rights.</text>
